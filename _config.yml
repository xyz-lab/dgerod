title: "Diego Escudero"
author: "dgerod"
tagline: "Roboticist"
description: "Diego Escudero, computer engineer specialized in robotics."
url: "https://dgerod.xyz-lab.org.es"
baseurl: ""
lang: en

twitter:
  username: dgerod
  card: summary

permalink: /blog/:year/:month/:day/:title:output_ext

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-titles-from-headings
  - jekyll-redirect-from

titles_from_headings:
  strip_title: true
  collections: true

feed:
  posts_limit: 20

defaults:
  - scope:
      path: ""
    values:
      image: /apple-touch-icon.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      tags: other

exclude:
  - docs
  - tools
  - vendor
  - .bundle
  - README.md
  - Gemfile
  - Gemfile.lock
