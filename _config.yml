title: "Diego Escudero"
author: "dgerod"
description: "Diego Escudero, computer engineer specialized in Robotics. Except where otherwise noted, content is licensed under CC BY 3.0."
url: "https://dgerod.github.io"
baseurl: ""
lang: en

twitter:
  username: dgerod

# Keep the same post URLs as the old blog: /YYYY/MM/DD/slug.html
# (explicit, so the blog/ folder is not added to the URL)
permalink: /:year/:month/:day/:title:output_ext

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-titles-from-headings
  - jekyll-redirect-from

# Posts take their title from their first "# Heading" (as in the old blog)
titles_from_headings:
  strip_title: true
  collections: true

feed:
  posts_limit: 20

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      tags: other

exclude:
  - docs
  - vendor
  - .bundle
  - README.md
  - Gemfile
  - Gemfile.lock
